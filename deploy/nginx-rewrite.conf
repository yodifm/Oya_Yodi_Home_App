# aaPanel → Website → oyayodihome.smartietls.online → URL rewrite.
# /api goes to Laravel; every other path is the React app (web/).
location ^~ /api/ {
    include fastcgi_params;
    fastcgi_pass unix:/tmp/php-cgi-82.sock;
    fastcgi_param SCRIPT_FILENAME /www/wwwroot/oyayodihome.smartietls.online/app/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /www/wwwroot/oyayodihome.smartietls.online/app/backend/public;
}

location / {
    try_files $uri $uri/ /index.html;
}
